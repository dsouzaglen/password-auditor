[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-password-auditor"
version = "1.0.0"
description = "Defensive password-strength auditing and authentication-event detection for SOC labs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Glen Jude Dsouza" }]
keywords = ["cybersecurity", "soc", "password-audit", "siem", "mitre-attack"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
password-auditor = "password_auditor.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
password_auditor = ["data/*.txt"]

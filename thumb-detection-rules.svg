<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="t d">
  <title id="t">Detection Rules</title>
  <desc id="d">Sliding-window brute-force and burst detection mapped to MITRE ATT&amp;CK T1110, emitting Wazuh-friendly JSONL alerts.</desc>
  <defs>
    <linearGradient id="bg" x2="100%" y2="100%">
      <stop stop-color="#050d14"/><stop offset=".55" stop-color="#0a1a12"/><stop offset="1" stop-color="#081822"/>
    </linearGradient>
    <linearGradient id="sg" x1="0" x2="1">
      <stop offset="0" stop-color="#00e676" stop-opacity="0"/><stop offset=".5" stop-color="#00e676" stop-opacity=".9"/><stop offset="1" stop-color="#00e676" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1d3a4a" stroke-width="1" opacity=".45"/>
    </pattern>
    <filter id="gl" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="fr"><rect width="600" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#fr)">
    <rect width="600" height="300" fill="url(#bg)"/>
    <rect width="600" height="300" fill="url(#grid)"/>
    <rect x="0" y="0" width="50" height="300" fill="url(#sg)" opacity=".35">
      <animate attributeName="x" values="-50;600;-50" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="5" y="5" width="590" height="290" rx="15" fill="none" stroke="#00e676" stroke-width="2" stroke-dasharray="26 12" opacity=".8">
      <animate attributeName="stroke-dashoffset" values="0;-76" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="28" y="52" fill="#00e676" font-family="sans-serif" font-size="24" font-weight="800">Detection Rules</text>
    <text x="28" y="80" fill="#9fb3c8" font-family="monospace" font-size="14">PA1001 · PA1002 · PA1003</text>
    <g font-family="monospace" font-size="13" fill="#e9eff6">
      <text x="28" y="122">▸ 5 failures / 60s · one account</text>
      <text x="28" y="150">▸ 10 accounts / 60s · one source</text>
      <text x="28" y="178">▸ 10 sources / 60s · one account</text>
    </g>
    <g>
      <rect x="28" y="252" width="30" height="26" fill="#00e676"><animate attributeName="height" values="10;26;10" dur="2s" repeatCount="indefinite"/><animate attributeName="y" values="268;252;268" dur="2s" repeatCount="indefinite"/></rect>
      <rect x="66" y="240" width="30" height="38" fill="#8ce5d0"><animate attributeName="height" values="16;38;16" dur="2s" begin="-.35s" repeatCount="indefinite"/><animate attributeName="y" values="262;240;262" dur="2s" begin="-.35s" repeatCount="indefinite"/></rect>
      <rect x="104" y="228" width="30" height="50" fill="#00a0e3"><animate attributeName="height" values="22;50;22" dur="2s" begin="-.7s" repeatCount="indefinite"/><animate attributeName="y" values="256;228;256" dur="2s" begin="-.7s" repeatCount="indefinite"/></rect>
      <rect x="142" y="262" width="18" height="16" fill="#ff5f57"><animate attributeName="opacity" values="1;.3;1" dur="1s" repeatCount="indefinite"/></rect>
    </g>
    <text x="572" y="272" text-anchor="end" fill="#7d90a3" font-family="monospace" font-size="12">MITRE T1110 · JSONL</text>
    <g transform="translate(492 24)">
      <rect x="0" y="0" width="80" height="24" rx="12" fill="#00e676" opacity=".12"/>
      <rect x="0" y="0" width="80" height="24" rx="12" fill="none" stroke="#00e676" stroke-width="1.5">
        <animate attributeName="opacity" values=".4;1;.4" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="40" y="17" text-anchor="middle" fill="#00e676" font-family="monospace" font-size="11" font-weight="700">● LAB</text>
    </g>
  </g>
</svg>

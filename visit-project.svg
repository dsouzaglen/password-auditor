<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200" role="img" aria-labelledby="t d">
  <title id="t">Open the project page — dsouzaglen.github.io/password-auditor/ · Python 3.10+ · MIT</title>
  <desc id="d">Animated button card linking to https://dsouzaglen.github.io/password-auditor/</desc>
  <defs>
    <linearGradient id="bg" x2="100%" y2="100%">
      <stop stop-color="#050d14"/><stop offset=".55" stop-color="#0a1a12"/><stop offset="1" stop-color="#081822"/>
    </linearGradient>
    <linearGradient id="gr" x1="0" x2="1">
      <stop stop-color="#00e676"/><stop offset=".5" stop-color="#8ce5d0"/><stop offset="1" stop-color="#00a0e3"/>
    </linearGradient>
    <linearGradient id="sg" x1="0" x2="1">
      <stop offset="0" stop-color="#00e676" stop-opacity="0"/><stop offset=".5" stop-color="#00e676" stop-opacity=".9"/><stop offset="1" stop-color="#00e676" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1d3a4a" stroke-width="1" opacity=".45"/>
    </pattern>
    <filter id="gl" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="fr"><rect width="960" height="200" rx="20"/></clipPath>
    <path id="rail" d="M-40 150 H1000"/>
  </defs>
  <g clip-path="url(#fr)">
    <rect width="960" height="200" fill="url(#bg)"/>
    <rect width="960" height="200" fill="url(#grid)"/>
    <rect x="0" y="0" width="60" height="200" fill="url(#sg)" opacity=".35">
      <animate attributeName="x" values="-60;960;-60" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="6" y="6" width="948" height="188" rx="16" fill="none" stroke="#00e676" stroke-width="2" stroke-dasharray="28 14" opacity=".8">
      <animate attributeName="stroke-dashoffset" values="0;-84" dur="2s" repeatCount="indefinite"/>
    </rect>
    <use href="#rail" stroke="#00e676" stroke-width="2.5" opacity=".9" fill="none"/>
    <g><circle r="7" fill="#00e676" filter="url(#gl)"/><circle r="3.5" fill="#eafff3"/>
      <animateMotion dur="3s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></g>
    <g opacity=".8"><circle r="7" fill="#8ce5d0" filter="url(#gl)"/><circle r="3.5" fill="#eafff3"/>
      <animateMotion dur="3s" begin="-1s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></g>
    <g><circle r="7" fill="#ff5f57" filter="url(#gl)"/><circle r="3.5" fill="#ffe9e7"/>
      <animateMotion dur="3s" begin="-1.5s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></g>
    <g text-anchor="middle">
      <text x="480" y="92" fill="url(#gr)" font-family="sans-serif" font-size="36" font-weight="800">Open the project page
        <animate attributeName="opacity" values="1;.65;1" dur="2s" repeatCount="indefinite"/>
      </text>
      <g transform="translate(713 66)" stroke="#8ce5d0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18 L18 2 M8 2 H18 V12"><animate attributeName="opacity" values="1;.65;1" dur="2s" repeatCount="indefinite"/></path></g>
      <text x="480" y="126" fill="#9fb3c8" font-family="monospace" font-size="14">dsouzaglen.github.io/password-auditor/ · Python 3.10+ · MIT</text>
    </g>
    <g transform="translate(880 22)">
      <rect x="0" y="0" width="58" height="24" rx="12" fill="#00e676" opacity=".12"/>
      <rect x="0" y="0" width="58" height="24" rx="12" fill="none" stroke="#00e676" stroke-width="1.5">
        <animate attributeName="opacity" values=".4;1;.4" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="29" y="17" text-anchor="middle" fill="#00e676" font-family="monospace" font-size="11" font-weight="700">● LIVE</text>
    </g>
  </g>
</svg>
